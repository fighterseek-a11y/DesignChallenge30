          package com.designchallenge30.data

          import android.content.Context
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.core.stringSetPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map

          private val Context.store by preferencesDataStore(name = "design30")

          data class Saved(val done: Set<Int>, val checks: Set<String>, val works: List<String>)

          class Repository(private val ctx: Context) {
              private val doneKey = stringSetPreferencesKey("done")
              private val checksKey = stringSetPreferencesKey("checks")
              private val worksKey = stringPreferencesKey("works")

              val saved: Flow<Saved> = ctx.store.data.map { p ->
                  Saved(
                      done = p[doneKey].orEmpty().mapNotNull { it.toIntOrNull() }.toSet(),
                      checks = p[checksKey].orEmpty(),
                      works = p[worksKey].orEmpty().split("|").filter { it.isNotBlank() }
                  )
              }

              suspend fun setCheck(taskId: Int, index: Int, on: Boolean) {
                  ctx.store.edit {
                      val key = "$taskId:$index"
                      val set = it[checksKey].orEmpty().toMutableSet()
                      if (on) set.add(key) else set.remove(key)
                      it[checksKey] = set
                  }
              }

              suspend fun complete(taskId: Int) {
                  ctx.store.edit { it[doneKey] = it[doneKey].orEmpty() + taskId.toString() }
              }

              suspend fun reset() {
                  ctx.store.edit {
                      it.remove(doneKey)
                      it.remove(checksKey)
                  }
              }

              suspend fun addWorks(names: List<String>) {
                  ctx.store.edit {
                      val old = it[worksKey].orEmpty().split("|").filter { s -> s.isNotBlank() }
                      it[worksKey] = (names + old).joinToString("|")
                  }
              }

              suspend fun removeWork(name: String) {
                  ctx.store.edit {
                      val old = it[worksKey].orEmpty().split("|").filter { s -> s.isNotBlank() && s != name }
                      it[worksKey] = old.joinToString("|")
                  }
              }
          }
          EOF
