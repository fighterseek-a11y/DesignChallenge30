          cat > app/src/main/java/com/designchallenge30/ui/theme/Theme.kt <<'EOF'
          package com.designchallenge30.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp

          val Graphite = Color(0xFF16181B)
          val Surface1 = Color(0xFF1F2226)
          val Surface2 = Color(0xFF2A2E33)
          val Acid = Color(0xFFB6FF3B)

          private val Colors = darkColorScheme(
              primary = Acid,
              onPrimary = Color(0xFF10130A),
              background = Graphite,
              onBackground = Color(0xFFF2F4F5),
              surface = Surface1,
              onSurface = Color(0xFFF2F4F5),
              surfaceVariant = Surface2,
              onSurfaceVariant = Color(0xFF9BA1A8),
              secondaryContainer = Surface2,
              onSecondaryContainer = Acid
          )

          private val Type = Typography(
              displayLarge = TextStyle(fontSize = 80.sp, fontWeight = FontWeight.Black, letterSpacing = (-2).sp),
              headlineLarge = TextStyle(fontSize = 32.sp, fontWeight = FontWeight.Bold, lineHeight = 38.sp),
              titleLarge = TextStyle(fontSize = 22.sp, fontWeight = FontWeight.SemiBold),
              bodyLarge = TextStyle(fontSize = 16.sp, lineHeight = 24.sp),
              labelLarge = TextStyle(fontSize = 13.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.5.sp)
          )

          @Composable
          fun DesignTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = Colors, typography = Type, content = content)
          }
