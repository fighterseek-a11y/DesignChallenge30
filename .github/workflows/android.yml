          @Composable
          private fun Muted(text: String) =
              Text(text, color = MaterialTheme.colorScheme.onSurfaceVariant, style = MaterialTheme.typography.bodyLarge)

          // ---------- Главная ----------
          @Composable
          fun HomeScreen(s: Saved, onStart: (Int) -> Unit) {
              val done = s.done.size
              val current = CHALLENGES.firstOrNull { it.id !in s.done }
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Tag("DESIGN CHALLENGE 30")
                  Text("$done/$TOTAL", style = MaterialTheme.typography.displayLarge)
                  LinearProgressIndicator(
                      progress = { done / TOTAL.toFloat() },
                      modifier = Modifier.fillMaxWidth().height(8.dp).clip(RoundedCornerShape(4.dp)),
                      color = MaterialTheme.colorScheme.primary,
                      trackColor = MaterialTheme.colorScheme.surfaceVariant
                  )
                  Muted("заданий выполнено")
                  if (current != null) {
                      AppCard {
                          Tag("ТЕКУЩЕЕ ЗАДАНИЕ №${current.id}")
                          Text(current.title, style = MaterialTheme.typography.headlineLarge)
                          Muted(current.description)
                          Muted("${current.category.title} · ${current.difficulty.title}")
                          Button(
                              onClick = { onStart(current.id) },
                              modifier = Modifier.fillMaxWidth().height(52.dp),
                              colors = ButtonDefaults.buttonColors(
                                  containerColor = MaterialTheme.colorScheme.primary,
                                  contentColor = MaterialTheme.colorScheme.onPrimary
                              )
                          ) { Text(if (done == 0) "Начать" else "Продолжить") }
                      }
                  } else {
                      AppCard {
                          Text("Все 30 заданий выполнены!", style = MaterialTheme.typography.headlineLarge)
                          Muted("Загляните в «Портфолио» и добавьте свои лучшие работы.")
                      }
                  }
              }
          }

          // ---------- Задания ----------
          @Composable
          fun TasksScreen(s: Saved, onOpen: (Int) -> Unit) {
              var cat by remember { mutableStateOf<Category?>(null) }
              val list = CHALLENGES.filter { cat == null || it.category == cat }
              Column(Modifier.fillMaxSize().padding(top = 20.dp)) {
                  Text("Задания", style = MaterialTheme.typography.headlineLarge, modifier = Modifier.padding(horizontal = 20.dp))
                  LazyRow(
                      contentPadding = androidx.compose.foundation.layout.PaddingValues(horizontal = 20.dp, vertical = 12.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      item { FilterChip(selected = cat == null, onClick = { cat = null }, label = { Text("Все") }) }
                      items(Category.entries.toList()) { c ->
                          FilterChip(selected = cat == c, onClick = { cat = c }, label = { Text(c.title) })
                      }
                  }
                  LazyColumn(
                      contentPadding = androidx.compose.foundation.layout.PaddingValues(horizontal = 20.dp, vertical = 4.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      items(list, key = { it.id }) { ch ->
                          Card(
                              modifier = Modifier.fillMaxWidth().clickable { onOpen(ch.id) },
                              shape = CardShape,
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)
                          ) {
                              Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                                      Tag("№${ch.id} · ${ch.category.title.uppercase()}")
                                      Text(ch.title, style = MaterialTheme.typography.titleLarge)
                                      Muted("Сложность: ${ch.difficulty.title}")
                                  }
                                  if (ch.id in s.done) {
                                      Icon(Icons.Filled.Check, "Выполнено", tint = MaterialTheme.colorScheme.primary)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // ---------- Экран задания ----------
          @Composable
          fun TaskScreen(
              id: Int,
              s: Saved,
              onCheck: (Int, Int, Boolean) -> Unit,
              onComplete: (Int) -> Unit,
              onBack: () -> Unit
          ) {
              val ch: Challenge = CHALLENGES.firstOrNull { it.id == id } ?: return
              val isDone = id in s.done
              val allChecked = ch.criteria.indices.all { "$id:$it" in s.checks }
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(horizontal = 20.dp, vertical = 12.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Назад") }
                  Tag("ЗАДАНИЕ №${ch.id} · ${ch.category.title.uppercase()}")
                  Text(ch.title, style = MaterialTheme.typography.headlineLarge)
                  Muted("Сложность: ${ch.difficulty.title}")
                  Text(ch.description, style = MaterialTheme.typography.bodyLarge)
                  AppCard {
                      Text("Критерии выполнения", style = MaterialTheme.typography.titleLarge)
                      ch.criteria.forEachIndexed { i, text ->
                          val checked = "$id:$i" in s.checks
                          Row(
                              Modifier.fillMaxWidth().clickable(enabled = !isDone) { onCheck(id, i, !checked) },
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Checkbox(
                                  checked = checked,
                                  onCheckedChange = if (isDone) null else { v -> onCheck(id, i, v) },
                                  colors = CheckboxDefaults.colors(
                                      checkedColor = MaterialTheme.colorScheme.primary,
                                      checkmarkColor = MaterialTheme.colorScheme.onPrimary
                                  )
                              )
                              Text(text, style = MaterialTheme.typography.bodyLarge)
                          }
                      }
                  }
                  if (isDone) {
                      Text("Задание завершено ✓", color = MaterialTheme.colorScheme.primary, style = MaterialTheme.typography.titleLarge)
                  } else {
                      Button(
                          onClick = { onComplete(id) },
                          enabled = allChecked,
                          modifier = Modifier.fillMaxWidth().height(52.dp),
                          colors = ButtonDefaults.buttonColors(
                              containerColor = MaterialTheme.colorScheme.primary,
                              contentColor = MaterialTheme.colorScheme.onPrimary
                          )
                      ) { Text("Завершить") }
                      if (!allChecked) Muted("Отметьте все критерии, чтобы завершить задание.")
                  }
              }
          }

          // ---------- Портфолио ----------
          private fun decode(f: File, max: Int = 600): ImageBitmap? {
              val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
              BitmapFactory.decodeFile(f.path, bounds)
              var sample = 1
              while (bounds.outWidth / (sample * 2) >= max) sample *= 2
              val opts = BitmapFactory.Options().apply { inSampleSize = sample }
              return BitmapFactory.decodeFile(f.path, opts)?.asImageBitmap()
          }

          @Composable
          private fun WorkImage(file: File, modifier: Modifier) {
              val bmp by produceState<ImageBitmap?>(null, file) {
                  value = withContext(Dispatchers.IO) { runCatching { decode(file) }.getOrNull() }
              }
              val b = bmp
              if (b != null) {
                  Image(b, "Моя работа", modifier, contentScale = ContentScale.Crop)
              } else {
                  Box(modifier.background(MaterialTheme.colorScheme.surfaceVariant))
              }
          }

          @Composable
          fun PortfolioScreen(
              s: Saved,
              dir: File,
              onAdd: (List<android.net.Uri>) -> Unit,
              onRemove: (String) -> Unit
          ) {
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.PickMultipleVisualMedia(10)) { uris ->
                  if (uris.isNotEmpty()) onAdd(uris)
              }
              Column(Modifier.fillMaxSize().padding(20.dp), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                  Text("Мои работы", style = MaterialTheme.typography.headlineLarge)
                  Button(
                      onClick = { picker.launch(PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly)) },
                      modifier = Modifier.fillMaxWidth().height(52.dp),
                      colors = ButtonDefaults.buttonColors(
                          containerColor = MaterialTheme.colorScheme.primary,
                          contentColor = MaterialTheme.colorScheme.onPrimary
                      )
                  ) {
                      Icon(Icons.Filled.Add, null)
                      Text("  Добавить работы")
                  }
                  if (s.works.isEmpty()) {
                      Muted("Пока пусто. Добавьте изображения из галереи — они сохранятся в приложении.")
                  } else {
                      LazyVerticalGrid(
                          columns = GridCells.Fixed(2),
                          horizontalArrangement = Arrangement.spacedBy(12.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                          modifier = Modifier.weight(1f)
                      ) {
                          gridItems(s.works, key = { it }) { name ->
                              Box(Modifier.aspectRatio(1f).clip(RoundedCornerShape(16.dp))) {
                                  WorkImage(File(dir, name), Modifier.fillMaxSize())
                                  IconButton(
                                      onClick = { onRemove(name) },
                                      modifier = Modifier.align(Alignment.TopEnd)
                                  ) { Icon(Icons.Filled.Delete, "Удалить", tint = MaterialTheme.colorScheme.primary) }
                              }
                          }
                      }
                  }
              }
          }

          // ---------- Профиль / статистика ----------
          @Composable
          fun ProfileScreen(s: Saved, onReset: () -> Unit) {
              val done = s.done.size
              var confirm by remember { mutableStateOf(false) }
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text("Профиль", style = MaterialTheme.typography.headlineLarge)
                  AppCard {
                      Tag("ПРОГРЕСС")
                      Text("${done * 100 / TOTAL}%", style = MaterialTheme.typography.displayLarge)
                      Muted("Завершено заданий: $done из $TOTAL")
                      Muted("Осталось: ${TOTAL - done}")
                  }
                  AppCard {
                      Tag("ПОРТФОЛИО")
                      Text("${s.works.size}", style = MaterialTheme.typography.headlineLarge)
                      Muted("сохранённых работ")
                  }
                  OutlinedButton(onClick = { confirm = true }, modifier = Modifier.fillMaxWidth().height(52.dp)) {
                      Text("Сбросить прогресс")
                  }
              }
              if (confirm) {
                  AlertDialog(
                      onDismissRequest = { confirm = false },
                      title = { Text("Сбросить прогресс?") },
                      text = { Text("Отметки заданий будут удалены. Работы в портфолио останутся.") },
                      confirmButton = { TextButton(onClick = { onReset(); confirm = false }) { Text("Сбросить") } },
                      dismissButton = { TextButton(onClick = { confirm = false }) { Text("Отмена") } }
                  )
              }
          }
