          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import androidx.lifecycle.viewmodel.compose.viewModel
          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.NavType
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.currentBackStackEntryAsState
          import androidx.navigation.compose.rememberNavController
          import androidx.navigation.navArgument

          private data class Tab(val route: String, val label: String, val icon: ImageVector)

          @Composable
          fun AppNav(vm: AppViewModel = viewModel()) {
              val saved by vm.state.collectAsStateWithLifecycle()
              val s = saved ?: return
              val nav = rememberNavController()
              val entry by nav.currentBackStackEntryAsState()
              val route = entry?.destination?.route
              val tabs = listOf(
                  Tab("home", "Главная", Icons.Filled.Home),
                  Tab("tasks", "Задания", Icons.AutoMirrored.Filled.ListIcon),
                  Tab("portfolio", "Портфолио", Icons.Filled.Star),
                  Tab("profile", "Профиль", Icons.Filled.Person)
              )
              Scaffold(
                  containerColor = MaterialTheme.colorScheme.background,
                  bottomBar = {
                      if (tabs.any { it.route == route }) {
                          NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                              tabs.forEach { t ->
                                  NavigationBarItem(
                                      selected = route == t.route,
                                      onClick = {
                                          nav.navigate(t.route) {
                                              popUpTo(nav.graph.findStartDestination().id) { saveState = true }
                                              launchSingleTop = true
                                              restoreState = true
                                          }
                                      },
                                      icon = { Icon(t.icon, contentDescription = t.label) },
                                      label = { Text(t.label) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = MaterialTheme.colorScheme.onPrimary,
                                          selectedTextColor = MaterialTheme.colorScheme.primary,
                                          indicatorColor = MaterialTheme.colorScheme.primary,
                                          unselectedIconColor = MaterialTheme.colorScheme.onSurfaceVariant,
                                          unselectedTextColor = MaterialTheme.colorScheme.onSurfaceVariant
                                      )
                                  )
                              }
                          }
                      }
                  }
              ) { pad ->
                  NavHost(nav, startDestination = "home", modifier = Modifier.padding(pad)) {
                      composable("home") { HomeScreen(s) { nav.navigate("task/$it") } }
                      composable("tasks") { TasksScreen(s) { nav.navigate("task/$it") } }
                      composable(
                          "task/{id}",
                          arguments = listOf(navArgument("id") { type = NavType.IntType })
                      ) { e ->
                          val id = e.arguments?.getInt("id") ?: 1
                          TaskScreen(id, s, vm::toggleCheck, vm::complete) { nav.popBackStack() }
                      }
                      composable("portfolio") { PortfolioScreen(s, vm.worksDir, vm::addWorks, vm::removeWork) }
                      composable("profile") { ProfileScreen(s, vm::reset) }
                  }
              }
          }
