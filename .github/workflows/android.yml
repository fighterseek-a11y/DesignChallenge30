          cat > app/src/main/java/com/designchallenge30/ui/AppViewModel.kt <<'EOF'
          package com.designchallenge30.ui

          import android.app.Application
          import android.net.Uri
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.designchallenge30.data.Repository
          import com.designchallenge30.data.Saved
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class AppViewModel(app: Application) : AndroidViewModel(app) {
              private val repo = Repository(app)
              val worksDir = File(app.filesDir, "works").apply { mkdirs() }

              val state: StateFlow<Saved?> =
                  repo.saved.stateIn(viewModelScope, SharingStarted.Eagerly, null)

              fun toggleCheck(taskId: Int, index: Int, on: Boolean) {
                  viewModelScope.launch { repo.setCheck(taskId, index, on) }
              }

              fun complete(taskId: Int) {
                  viewModelScope.launch { repo.complete(taskId) }
              }

              fun reset() {
                  viewModelScope.launch { repo.reset() }
              }

              fun addWorks(uris: List<Uri>) {
                  viewModelScope.launch {
                      val names = withContext(Dispatchers.IO) {
                          uris.mapIndexedNotNull { i, uri ->
                              runCatching {
                                  val name = "work_${System.currentTimeMillis()}_$i.jpg"
                                  val input = getApplication<Application>().contentResolver.openInputStream(uri)!!
                                  input.use { src -> File(worksDir, name).outputStream().use { src.copyTo(it) } }
                                  name
                              }.getOrNull()
                          }
                      }
                      if (names.isNotEmpty()) repo.addWorks(names)
                  }
              }

              fun removeWork(name: String) {
                  viewModelScope.launch {
                      repo.removeWork(name)
                      withContext(Dispatchers.IO) { File(worksDir, name).delete() }
                  }
              }
          }
